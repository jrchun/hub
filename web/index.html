<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>앱 허브</title>
<!-- 링크 미리보기(카톡 등)와 앱 허브 카드. 제목·설명은 web/app.json의 name·summary와 맞춘다. -->
<meta property="og:title" content="앱 허브">
<meta property="og:description" content="내가 만든 앱들을 한 화면에서 보는 곳">
<meta property="og:image" content="/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="head-row">
      <h1>앱 허브</h1>
      <div class="head-actions">
        <div class="seg" role="group" aria-label="보기 방식">
          <button type="button" id="viewGrid" aria-pressed="true">격자</button>
          <button type="button" id="viewList" aria-pressed="false">목록</button>
        </div>
        <button type="button" id="editBtn" class="ghost">편집</button>
      </div>
    </div>
    <p class="sub num" id="summary" aria-live="polite">불러오는 중</p>
  </header>

  <form class="token" id="tokenForm" hidden>
    <label for="tokenIn" id="tokenLabel">편집 암호</label>
    <input id="tokenIn" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">확인</button>
  </form>

  <div class="edit-bar" id="editBar" hidden>
    <button type="button" id="refreshBtn" class="primary">지금 확인</button>
    <span class="hint">매일 08:00 자동 확인 · 숨기기·삭제는 목록 보기에서</span>
    <button type="button" id="logoutAll" class="ghost">모든 기기에서 로그아웃</button>
  </div>

  <nav class="chips" id="chips" aria-label="분류"></nav>

  <p class="hint" id="status" role="status" aria-live="polite"></p>

  <main class="list" id="list"></main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
